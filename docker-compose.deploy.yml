name: rwr-production

services:
  nginx:
    image: ghcr.io/yellow-pang/rwr-web:${RWR_IMAGE_TAG:?RWR_IMAGE_TAG is required}
    ports:
      - "127.0.0.1:${NGINX_PORT:-8090}:80"
    depends_on:
      - server
    networks:
      - rwr-network
    restart: unless-stopped

  server:
    image: ghcr.io/yellow-pang/rwr-server:${RWR_IMAGE_TAG:?RWR_IMAGE_TAG is required}
    environment:
      PORT: 3000
      NODE_ENV: ${NODE_ENV:-production}
      CORS_ORIGIN: ${CORS_ORIGIN}
      JSON_BODY_LIMIT: ${JSON_BODY_LIMIT:-4kb}
      API_RATE_LIMIT_WINDOW_MS: ${API_RATE_LIMIT_WINDOW_MS:-900000}
      API_RATE_LIMIT_MAX: ${API_RATE_LIMIT_MAX:-300}
      EXTERNAL_API_RATE_LIMIT_WINDOW_MS: ${EXTERNAL_API_RATE_LIMIT_WINDOW_MS:-300000}
      EXTERNAL_API_RATE_LIMIT_MAX: ${EXTERNAL_API_RATE_LIMIT_MAX:-60}
      ORS_TIMEOUT_MS: ${ORS_TIMEOUT_MS:-8000}
      KAKAO_TIMEOUT_MS: ${KAKAO_TIMEOUT_MS:-5000}
      KAKAO_POI_TIMEOUT_MS: ${KAKAO_POI_TIMEOUT_MS:-5000}
      ORS_API_KEY: ${ORS_API_KEY}
      KAKAO_REST_API_KEY: ${KAKAO_REST_API_KEY}
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - rwr-network
    restart: unless-stopped

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - rwr_postgres_data:/var/lib/postgresql/data
      - ./server/src/db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./server/src/db/seed.sql:/docker-entrypoint-initdb.d/02-seed.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - rwr-network
    restart: unless-stopped

volumes:
  rwr_postgres_data:
    name: rwr-production-postgres-data

networks:
  rwr-network:
    name: rwr-production-network
    driver: bridge
