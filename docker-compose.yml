version: "3.9"

# ── 운영 환경 Docker Compose ─────────────────────────────────────────────────
# 서비스 구성: nginx (SPA + /api 프록시) + server (Express) + db (PostgreSQL)
# 실행: docker compose up -d --build
# 환경변수: 루트 .env 파일 (cp .env.example .env 후 실제 값으로 수정)

services:
  nginx:
    build:
      context: . # 루트를 context로 설정 (nginx/nginx.conf 접근 필요)
      dockerfile: ./client/Dockerfile
      args:
        VITE_KAKAO_MAP_KEY: ${VITE_KAKAO_MAP_KEY:-}
    ports:
      - "${NGINX_PORT:-8090}:80"
    depends_on:
      - server
    networks:
      - rwr-network
    restart: unless-stopped

  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    environment:
      PORT: 3000
      NODE_ENV: ${NODE_ENV:-production}
      CORS_ORIGIN: ${CORS_ORIGIN}
      JSON_BODY_LIMIT: ${JSON_BODY_LIMIT:-4kb}
      API_RATE_LIMIT_WINDOW_MS: ${API_RATE_LIMIT_WINDOW_MS:-900000}
      API_RATE_LIMIT_MAX: ${API_RATE_LIMIT_MAX:-300}
      EXTERNAL_API_RATE_LIMIT_WINDOW_MS: ${EXTERNAL_API_RATE_LIMIT_WINDOW_MS:-300000}
      EXTERNAL_API_RATE_LIMIT_MAX: ${EXTERNAL_API_RATE_LIMIT_MAX:-60}
      ORS_TIMEOUT_MS: ${ORS_TIMEOUT_MS:-8000}
      KAKAO_TIMEOUT_MS: ${KAKAO_TIMEOUT_MS:-5000}
      KAKAO_POI_TIMEOUT_MS: ${KAKAO_POI_TIMEOUT_MS:-5000}
      ORS_API_KEY: ${ORS_API_KEY}
      KAKAO_REST_API_KEY: ${KAKAO_REST_API_KEY}
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - rwr-network
    restart: unless-stopped

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - rwr_postgres_data:/var/lib/postgresql/data
      - ./server/src/db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./server/src/db/seed.sql:/docker-entrypoint-initdb.d/02-seed.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - rwr-network
    restart: unless-stopped

volumes:
  rwr_postgres_data:

networks:
  rwr-network:
    driver: bridge
