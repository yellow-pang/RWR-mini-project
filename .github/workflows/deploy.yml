name: Deploy to VM

on:
  push:
    branches:
      - main

# ── GitHub Secrets 등록 필요 항목 ─────────────────────────────────────────────
# Settings → Secrets and variables → Actions → New repository secret
#   NGINX_PORT         : 8090
#   NODE_ENV           : production
#   CORS_ORIGIN        : https://rwr.yourdomain.com
#   POSTGRES_USER      : rwr_user
#   POSTGRES_PASSWORD  : (강력한 비밀번호 — $, & 등 특수문자 제외 권장)
#   POSTGRES_DB        : rwr_db
#   VITE_KAKAO_MAP_KEY : 카카오맵 JS API 키 (없으면 빈 값)

jobs:
  deploy:
    name: Build & Deploy (self-hosted)
    # VM에 설치한 GitHub Actions self-hosted runner에서 직접 실행
    runs-on: self-hosted

    steps:
      # ── 1. 코드 체크아웃 ─────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── 2. 루트 .env 생성 (GitHub Secrets → 파일) ──────────────
      # ⚠️ 비밀번호 특수문자 안전 처리: printf '%s\n' 방식 사용
      # echo "VAR=$VALUE" 방식은 $, &, " 등 특수문자에서 파싱 오류 발생 가능
      - name: Create .env from GitHub Secrets
        run: |
          printf 'NGINX_PORT=%s\n'         "${{ secrets.NGINX_PORT }}"         >  .env
          printf 'NODE_ENV=%s\n'           "${{ secrets.NODE_ENV }}"            >> .env
          printf 'CORS_ORIGIN=%s\n'        "${{ secrets.CORS_ORIGIN }}"         >> .env
          printf 'POSTGRES_USER=%s\n'      "${{ secrets.POSTGRES_USER }}"       >> .env
          printf 'POSTGRES_PASSWORD=%s\n'  "${{ secrets.POSTGRES_PASSWORD }}"   >> .env
          printf 'POSTGRES_DB=%s\n'        "${{ secrets.POSTGRES_DB }}"         >> .env
          printf 'VITE_KAKAO_MAP_KEY=%s\n' "${{ secrets.VITE_KAKAO_MAP_KEY }}"  >> .env

      # ── 3. Docker 이미지 빌드 및 컨테이너 재시작 ─────────────────
      - name: Build and restart containers
        run: |
          docker compose up -d --build --remove-orphans

      # ── 4. 헬스체크 (nginx가 응답할 때까지 최대 30초 대기) ──────
      - name: Health check
        run: |
          PORT="${{ secrets.NGINX_PORT }}"
          PORT="${PORT:-8090}"
          for i in $(seq 1 10); do
            if curl -sf "http://localhost:${PORT}/" > /dev/null 2>&1; then
              echo "Health check passed (attempt ${i})"
              exit 0
            fi
            echo "Waiting... (attempt ${i}/10)"
            sleep 3
          done
          echo "Health check failed"
          docker compose logs --tail=50
          exit 1

      # ── 5. 오래된 이미지 정리 ────────────────────────────────────
      - name: Clean up dangling images
        if: always()
        run: docker image prune -f
