name: Deploy to VM

on:
  push:
    branches:
      - main

# ── GitHub Secrets 등록 필요 항목 ─────────────────────────────────────────────
# Settings → Secrets and variables → Actions → New repository secret
#   ENV_FILE : 로컬 .env 파일 전체 내용을 그대로 붙여넣기
#              (변수가 추가·변경되어도 deploy.yml 수정 없이 Secret 값만 업데이트)
#              ORS_API_KEY 같은 서버 전용 키도 ENV_FILE에 포함해야 함

jobs:
  deploy:
    name: Build & Deploy (self-hosted)
    # VM에 설치한 GitHub Actions self-hosted runner에서 직접 실행
    runs-on: self-hosted

    steps:
      # ── 1. 코드 체크아웃 ─────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── 2. 루트 .env 생성 (GitHub Secret ENV_FILE → 파일) ──────
      # ENV_FILE Secret에 로컬 .env 파일 전체 내용을 붙여넣으면 됩니다.
      # env: 블록으로 받아 shell 변수로 전달 → 멀티라인 값이 안전하게 보존됩니다.
      - name: Create .env from GitHub Secret
        env:
          ENV_FILE: ${{ secrets.ENV_FILE }}
        run: printf '%s' "$ENV_FILE" > .env

      # ── 3. Docker 이미지 빌드 및 컨테이너 재시작 ─────────────────
      - name: Build and restart containers
        run: |
          docker compose up -d --build --remove-orphans

      # ── 4. 헬스체크 (nginx가 응답할 때까지 최대 30초 대기) ──────
      - name: Health check
        run: |
          PORT=$(grep '^NGINX_PORT=' .env | cut -d'=' -f2)
          PORT="${PORT:-8090}"
          for i in $(seq 1 10); do
            if curl -sf "http://localhost:${PORT}/" > /dev/null 2>&1; then
              echo "Health check passed (attempt ${i})"
              exit 0
            fi
            echo "Waiting... (attempt ${i}/10)"
            sleep 3
          done
          echo "Health check failed"
          docker compose logs --tail=50
          exit 1

      # ── 5. 오래된 이미지 정리 ────────────────────────────────────
      - name: Clean up dangling images
        if: always()
        run: docker image prune -f
